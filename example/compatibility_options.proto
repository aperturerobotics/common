syntax = "proto3";
package compatibility;

import "google/protobuf/descriptor.proto";

extend google.protobuf.MethodOptions {
  // CompatibilityMethod records the fixture method compatibility label.
  string compatibility_method = 50001;
}

// OptionRequest carries the custom-option fixture value.
message OptionRequest {
  // Value contains the custom-option fixture value.
  string value = 1;
}

// OptionService exercises custom method-option preservation.
service OptionService {
  // Describe returns the supplied custom-option fixture.
  rpc Describe(OptionRequest) returns (OptionRequest) {
    option (compatibility_method) = "compatibility-v1";
  }
}
